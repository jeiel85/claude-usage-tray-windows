name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-fd:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.x'

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Run tests
        run: dotnet test ClaudeUsageTray.Tests/ClaudeUsageTray.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Build main app (framework-dependent)
        run: |
          dotnet publish ClaudeUsageTray/ClaudeUsageTray.csproj `
            -c Release `
            -p:PublishDir=bin/fd `
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Generate SHA256 for main app
        shell: powershell
        run: |
          $hash = (Get-FileHash "ClaudeUsageTray/bin/fd/ClaudeUsageTray.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash" | Out-File -FilePath "SHA256.txt" -Encoding ASCII
          Write-Host "fd size: $([math]::Round((Get-Item 'ClaudeUsageTray/bin/fd/ClaudeUsageTray.exe').Length/1MB, 1)) MB"
          Write-Host "SHA256: $hash"

      - name: Copy executable to root
        shell: powershell
        run: |
          Copy-Item "ClaudeUsageTray/bin/fd/ClaudeUsageTray.exe" "ClaudeUsageTray.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: fd-release
          path: |
            ClaudeUsageTray.exe
            SHA256.txt

  # 휴대폰 앱(mobile/, #220). 서명 키 시크릿이 있으면 정식 서명 APK, 없으면 디버그 서명 APK 를 올린다.
  # 시크릿: CUT_RELEASE_KEYSTORE_BASE64, CUT_RELEASE_STORE_PASSWORD, CUT_RELEASE_KEY_ALIAS, CUT_RELEASE_KEY_PASSWORD
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.CUT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "enabled=true" >> $GITHUB_OUTPUT; else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::CUT_RELEASE_KEYSTORE_BASE64 is not set — attaching a debug-signed APK instead (installable, but a later properly signed APK needs one reinstall)."
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        working-directory: mobile
        env:
          KEYSTORE: ${{ secrets.CUT_RELEASE_KEYSTORE_BASE64 }}
          CUT_RELEASE_STORE_PASSWORD: ${{ secrets.CUT_RELEASE_STORE_PASSWORD }}
          CUT_RELEASE_KEY_ALIAS: ${{ secrets.CUT_RELEASE_KEY_ALIAS }}
          CUT_RELEASE_KEY_PASSWORD: ${{ secrets.CUT_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > release.jks
          export CUT_RELEASE_STORE_FILE=release.jks
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease -Pcut.version=${GITHUB_REF_NAME#v} -Pcut.requireReleaseSigning=true
          cp app/build/outputs/apk/release/app-release.apk ../ClaudeUsageTray-Mobile.apk
          rm -f release.jks

      # 앱 내 업데이트(#228)가 읽는 update.json. 값은 빌드 스크립트가 아니라 방금 만든 APK 자체에서 뽑는다(버전·minSdk 는
      # badging, 크기·해시는 파일). 정식 서명일 때만 만든다 — Android 는 같은 키로 서명된 APK 만 업데이트로 설치하므로,
      # 실행마다 키가 다른 디버그 서명 APK 를 앱에 제안하면 설치 단계에서 반드시 거부된다. update.json 이 없는 릴리스에서는
      # 앱이 404 를 "새 버전 없음" 으로 보고 조용히 넘어간다.
      - name: Verify signature and write update.json
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs ClaudeUsageTray-Mobile.apk
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging ClaudeUsageTray-Mobile.apk)"
          export VERSION_CODE="$(echo "$BADGING" | grep -o "[[:space:]]versionCode='[0-9]*'" | head -n 1 | tr -dc '0-9')"
          export VERSION_NAME="$(echo "$BADGING" | grep -o "[[:space:]]versionName='[^']*'" | head -n 1 | sed "s/.*='//; s/'$//")"
          export MIN_SDK="$(echo "$BADGING" | grep -o "^minSdkVersion:'[0-9]*'" | head -n 1 | tr -dc '0-9')"
          export APK_SIZE="$(stat -c %s ClaudeUsageTray-Mobile.apk)"
          export APK_SHA256="$(sha256sum ClaudeUsageTray-Mobile.apk | awk '{ print $1 }')"
          test "$VERSION_NAME" = "${GITHUB_REF_NAME#v}"
          python3 - > update.json <<'PY'
          import json, os
          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          print(json.dumps({
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/ClaudeUsageTray-Mobile.apk",
              "apkSizeBytes": int(os.environ["APK_SIZE"]),
              "sha256": os.environ["APK_SHA256"],
              "minSdk": int(os.environ["MIN_SDK"]),
              "releaseNotesUrl": f"https://github.com/{repo}/releases/tag/{tag}",
          }, indent=2))
          PY
          python3 -c "import json; d=json.load(open('update.json')); assert d['versionCode']>0 and len(d['sha256'])==64 and d['apkUrl'].startswith('https://'), d"
          cat update.json

      # 서명 키가 아직 없을 때의 대체: 디버그 서명 APK. 설치는 되지만 실행마다 다른 디버그 키라, 나중에 정식 서명으로
      # 바꾸면 한 번 지우고 다시 설치해야 한다. 휴대폰 앱 배포가 서명 키 준비를 기다리지 않게 한다(#220).
      - name: Build debug-signed APK (no signing secrets)
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug -Pcut.version=${GITHUB_REF_NAME#v}
          cp app/build/outputs/apk/debug/app-debug.apk ../ClaudeUsageTray-Mobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-release
          path: |
            ClaudeUsageTray-Mobile.apk
            update.json

  release:
    needs: [build-fd, build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: fd-release
          path: artifacts/

      - name: Download APK (if built)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: apk-release
          path: artifacts/

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # [1.15.37] 형식의 헤더를 찾아 다음 헤더 전까지 추출
          NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d')
          if [ -z "$NOTES" ]; then
            NOTES="Release v$VERSION"
          fi
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.NOTES }}
          fail_on_unmatched_files: false
          files: |
            artifacts/ClaudeUsageTray.exe
            artifacts/SHA256.txt
            artifacts/ClaudeUsageTray-Mobile.apk
            artifacts/update.json
