name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build self-contained release
        run: |
          dotnet publish ClaudeUsageTray/ClaudeUsageTray.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishDir=bin/sc `
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Clean between builds
        run: dotnet clean ClaudeUsageTray/ClaudeUsageTray.csproj -c Release

      - name: Build framework-dependent release
        run: |
          dotnet publish ClaudeUsageTray/ClaudeUsageTray.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:PublishDir=bin/fd `
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Generate SHA256 hashes
        shell: powershell
        run: |
          $scExe = "ClaudeUsageTray/bin/sc/ClaudeUsageTray.exe"
          $fdExe = "ClaudeUsageTray/bin/fd/ClaudeUsageTray.exe"

          $scHash = (Get-FileHash $scExe -Algorithm SHA256).Hash.ToLower()
          "$scHash  ClaudeUsageTray-sc.exe" | Out-File -FilePath "ClaudeUsageTray-sc.sha256" -Encoding ASCII

          $fdHash = (Get-FileHash $fdExe -Algorithm SHA256).Hash.ToLower()
          "$fdHash  ClaudeUsageTray-fd.exe" | Out-File -FilePath "ClaudeUsageTray-fd.sha256" -Encoding ASCII

          Write-Host "SHA256 (self-contained): $scHash"
          Write-Host "SHA256 (framework-dependent): $fdHash"

      - name: Rename executables for release
        shell: powershell
        run: |
          Copy-Item "ClaudeUsageTray/bin/sc/ClaudeUsageTray.exe" "ClaudeUsageTray/bin/sc/ClaudeUsageTray-sc.exe"
          Copy-Item "ClaudeUsageTray/bin/fd/ClaudeUsageTray.exe" "ClaudeUsageTray/bin/fd/ClaudeUsageTray-fd.exe"
          Write-Host "Renamed sc and fd exes"

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Extract section between this version header and the next
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.changelog.outputs.NOTES }}
          files: |
            ClaudeUsageTray/bin/sc/ClaudeUsageTray-sc.exe
            ClaudeUsageTray-sc.sha256
            ClaudeUsageTray/bin/fd/ClaudeUsageTray-fd.exe
            ClaudeUsageTray-fd.sha256
