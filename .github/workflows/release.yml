name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-fd:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Run tests
        run: dotnet test ClaudeUsageTray.Tests/ClaudeUsageTray.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Build main app (framework-dependent)
        run: |
          dotnet publish ClaudeUsageTray/ClaudeUsageTray.csproj `
            -c Release `
            -p:PublishDir=bin/fd `
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Generate SHA256 for main app
        shell: powershell
        run: |
          $hash = (Get-FileHash "ClaudeUsageTray/bin/fd/ClaudeUsageTray.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash" | Out-File -FilePath "SHA256.txt" -Encoding ASCII
          Write-Host "fd size: $([math]::Round((Get-Item 'ClaudeUsageTray/bin/fd/ClaudeUsageTray.exe').Length/1MB, 1)) MB"
          Write-Host "SHA256: $hash"

      - name: Copy executable to root
        shell: powershell
        run: |
          Copy-Item "ClaudeUsageTray/bin/fd/ClaudeUsageTray.exe" "ClaudeUsageTray.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fd-release
          path: |
            ClaudeUsageTray.exe
            SHA256.txt

  release:
    needs: [build-fd]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: fd-release
          path: artifacts/

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # [1.15.37] 형식의 헤더를 찾아 다음 헤더 전까지 추출
          NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d')
          if [ -z "$NOTES" ]; then
            NOTES="Release v$VERSION"
          fi
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.NOTES }}
          files: |
            artifacts/ClaudeUsageTray.exe
            artifacts/SHA256.txt
