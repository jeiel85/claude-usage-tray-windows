name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-sc:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build self-contained release
        run: |
          dotnet publish ClaudeUsageTray/ClaudeUsageTray.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishDir=bin/sc `
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Generate SHA256
        shell: powershell
        run: |
          $hash = (Get-FileHash "ClaudeUsageTray/bin/sc/ClaudeUsageTray.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash" | Out-File -FilePath "SHA256.txt" -Encoding ASCII
          Write-Host "sc size: $([math]::Round((Get-Item 'ClaudeUsageTray/bin/sc/ClaudeUsageTray.exe').Length/1MB, 1)) MB"
          Write-Host "SHA256: $hash"

      - name: Rename executable
        shell: powershell
        run: Copy-Item "ClaudeUsageTray/bin/sc/ClaudeUsageTray.exe" "ClaudeUsageTray.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sc-release
          path: |
            ClaudeUsageTray.exe
            SHA256.txt

  release:
    needs: [build-sc]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sc-release
          path: artifacts/

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.NOTES }}
          files: |
            artifacts/ClaudeUsageTray.exe
            artifacts/SHA256.txt
