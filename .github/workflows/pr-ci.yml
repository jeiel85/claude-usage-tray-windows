name: PR CI

# 릴리스 워크플로(release.yml)는 태그에만 돌기 때문에, PR 단계에서 빌드·테스트를 확인할 곳이 없었다.
# - windows: Windows 앱 빌드(경고 0 확인) + xUnit 테스트(휴대폰 프로토콜 픽스처 포함)
# - android: 휴대폰 앱(mobile/) 단위 테스트(같은 픽스처 파싱) + lint + 디버그 APK(아티팩트로 내려받아 설치 시험 가능)
on:
  pull_request:
    paths:
      - 'ClaudeUsageTray/**'
      - 'ClaudeUsageTray.Tests/**'
      - 'mobile/**'
      - 'docs/mobile-protocol/**'
      - '.github/workflows/pr-ci.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.x'

      - name: Build (warnings as errors)
        run: dotnet build ClaudeUsageTray/ClaudeUsageTray.csproj -c Release -warnaserror

      # 실제 외부 서비스(GitHub 릴리스·날씨)를 부르는 테스트(Category=Network)는 release.yml 처럼 게이트에서 뺀다 —
      # #301 은 러너의 GitHub API rate limit 하나로 빨갛게 떴다(#302). 아래 단계에서 따로 돌려 결과는 남기되 막지 않는다.
      - name: Test
        run: dotnet test ClaudeUsageTray.Tests/ClaudeUsageTray.Tests.csproj -c Release --filter "Category!=Network" --logger "console;verbosity=normal"

      # 토큰 없이 부르면 러너 IP 공용 한도(시간당 60회)에 걸리므로 이 작업의 읽기 전용 토큰으로 GitHub API 를 부른다.
      # release.yml 의 토큰은 contents: write 라 그쪽 테스트에는 넘기지 않는다.
      - name: Test (network, non-blocking)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet test ClaudeUsageTray.Tests/ClaudeUsageTray.Tests.csproj -c Release --no-build --filter "Category=Network" --logger "console;verbosity=normal"

      # 창을 이미지로 렌더링해(#224) 아티팩트로 올리고, 아티팩트를 받을 수 없는 리뷰 환경을 위해 로그에도 base64 로 남긴다.
      - name: Render UI snapshots
        env:
          CUT_UI_SNAPSHOT_DIR: ${{ runner.temp }}\ui
        run: dotnet test ClaudeUsageTray.Tests/ClaudeUsageTray.Tests.csproj -c Release --no-build --filter "Category=UiSnapshot"

      - name: Print UI snapshots
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\ui\*.jpg" | ForEach-Object {
            "=====BEGIN $($_.Name)====="
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($i = 0; $i -lt $b.Length; $i += 4000) { $b.Substring($i, [Math]::Min(4000, $b.Length - $i)) }
            "=====END $($_.Name)====="
          }

      - name: Upload UI snapshots
        uses: actions/upload-artifact@v6
        with:
          name: ui-snapshots
          path: ${{ runner.temp }}\ui\*.jpg
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests, lint, debug build (both channels, #257)
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testGithubDebugUnitTest testPlayDebugUnitTest lintGithubDebug lintPlayDebug assembleGithubDebug assemblePlayDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claude-usage-mobile-debug
          path: mobile/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: ignore
